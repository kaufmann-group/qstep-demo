project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - "D-wave SDK Demonstration Quantum Annealing.ipynb"
    - "Quantum Annealing Explained.ipynb"
    - "Additional D-wave Topics.ipynb"

website:
  title: "QSTEP"
  favicon: purdue.ico

  navbar:
    right:
      - icon: github
        href: https://github.com/kaufmann-group/qstep-demo
        aria-label: GitHub

  sidebar:
    style: docked
    search: false
    contents:
      - href: index.qmd
        text: Overview

      - section: "Main Tutorials"
        contents:
          - href: "D-wave SDK Demonstration Quantum Annealing.ipynb"
            text: D-Wave Quantum Annealing

      - section: "Background & Additional Topics"
        contents:
          - href: "Quantum Annealing Explained.ipynb"
            text: Quantum Annealing Explained

          - href: "Additional D-wave Topics.ipynb"
            text: Additional D-Wave Topics

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "On this page"
    toc-location: right
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    css: styles.css

execute:
  freeze: auto